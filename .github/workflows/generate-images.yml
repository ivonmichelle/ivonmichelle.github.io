name: Generate Images & Ilustrasi JSON

on:
  push:
    paths:
      - 'images/**'
      - 'ilustrasi/**'
  workflow_dispatch: # Supaya bisa dijalankan manual dari tab Actions di GitHub

jobs:
  build-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate images.json
        run: |
          if [ -d "images" ]; then
            cd images
            python3 -c "
          import os, json
          valid_exts = ('.jpg', '.jpeg', '.png', '.webp', '.gif')
          files = [f for f in os.listdir('.') if f.lower().endswith(valid_exts)]
          with open('../images.json', 'w') as out:
              json.dump(files, out, indent=2)
          "
            cd ..
          fi

      - name: Generate ilustrasi.json
        run: |
          if [ -d "ilustrasi" ]; then
            cd ilustrasi
            python3 -c "
          import os, json
          valid_exts = ('.jpg', '.jpeg', '.png', '.webp', '.gif')
          files = [f for f in os.listdir('.') if f.lower().endswith(valid_exts)]
          # Format array objek agar kompatibel dengan pembacaan ilustrasi di index.html
          data = [{'file': f, 'caption': f} for f in files]
          with open('../ilustrasi.json', 'w') as out:
              json.dump(data, out, indent=2)
          "
            cd ..
          fi

      - name: Commit and Push JSON files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add images.json ilustrasi.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update images.json & ilustrasi.json" && git push)
