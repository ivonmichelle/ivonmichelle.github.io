name: Generate Images, Ilustrasi & BGM JSON

on:
  push:
    paths:
      - 'images/**'
      - 'ilustrasi/**'
      - 'bgm/**'
  workflow_dispatch: # Supaya bisa dijalankan manual dari tab Actions di GitHub

jobs:
  build-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Mengizinkan push kembali ke repo
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate images.json
        run: |
          if [ -d "images" ]; then
            cd images
            python3 -c "
          import os, json
          valid_exts = ('.jpg', '.jpeg', '.png', '.webp', '.gif')
          files = sorted([f for f in os.listdir('.') if f.lower().endswith(valid_exts)])
          with open('../images.json', 'w') as out:
              json.dump(files, out, indent=2)
          "
            cd ..
          fi

      - name: Generate ilustrasi.json
        run: |
          if [ -d "ilustrasi" ]; then
            cd ilustrasi
            python3 -c "
          import os, json
          valid_exts = ('.jpg', '.jpeg', '.png', '.webp', '.gif')
          files = sorted([f for f in os.listdir('.') if f.lower().endswith(valid_exts)])
          data = [{'file': f, 'caption': f} for f in files]
          with open('../ilustrasi.json', 'w') as out:
              json.dump(data, out, indent=2)
          "
            cd ..
          fi

      - name: Generate bgm.json
        run: |
          if [ -d "bgm" ]; then
            cd bgm
            python3 -c "
          import os, json
          valid_exts = ('.mp3', '.wav', '.ogg', '.m4a')
          files = sorted([f for f in os.listdir('.') if f.lower().endswith(valid_exts)])
          data = [{'file': f, 'title': os.path.splitext(f)[0]} for f in files]
          with open('../bgm.json', 'w') as out:
              json.dump(data, out, indent=2)
          "
            cd ..
          fi

      - name: Commit and Push JSON files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          [ -f images.json ] && git add images.json
          [ -f ilustrasi.json ] && git add ilustrasi.json
          [ -f bgm.json ] && git add bgm.json

          if ! git diff --staged --quiet; then
            git commit -m "auto: update images.json, ilustrasi.json & bgm.json"
            git push
          else
            echo "Tidak ada perubahan pada JSON."
          fi
