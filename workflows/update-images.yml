name: Update Images JSON

on:
  push:
    paths:
      - "images/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate images.json
        run: |
          echo "[" > images/images.json

          first=true
          find images -maxdepth 1 -type f | while read file
          do
            name=$(basename "$file")

            if [[ "$name" =~ \.(jpg|jpeg|png|webp|gif)$ ]]; then
              if [ "$first" = true ]; then
                first=false
              else
                echo "," >> images/images.json
              fi
              echo "  \"$name\"" >> images/images.json
            fi
          done

          echo "]" >> images/images.json

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add images/images.json

          git diff --cached --quiet || git commit -m "Update images.json"

          git push
