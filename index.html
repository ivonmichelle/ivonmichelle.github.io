<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- Mencegah Pinch Zoom di Mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pembaca Novel - Wooden Desktop Edition</title>
  <style>
    /* Reset & Base Styling */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* FIX UTAMA: Kunci total html & body agar scrollbar TIDAK PERNAH muncul walau 1 milidetik */
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh; /* Menggunakan Dynamic Viewport Height untuk tablet/mobile */
      overflow: hidden !important; 
      position: fixed; /* Mencegah layar membal/scroll di WebKit/iOS */
      touch-action: pan-x pan-y;
    }

    body {
      font-family: 'Georgia', 'Palatino', 'Times New Roman', serif;
      
      /* Background Tekstur Kayu / Earth Tone */
      background-color: #2b1d0c;
      background-image: 
        radial-gradient(ellipse at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.7) 100%),
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 4px),
        linear-gradient(90deg, #3a2612, #4a3219 25%, #2d1e0f 50%, #4a3219 75%, #3a2612);
      
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Container Utama Meja */
    .desk-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      box-sizing: border-box;
      transition: filter 0.4s ease;
    }

    /* Efek Blur/Bokeh untuk latar belakang saat foto di-zoom */
    .desk-container.blurred .book-page,
    .desk-container.blurred .polaroid:not(.zoomed) {
      filter: blur(8px) brightness(0.6);
      transition: filter 0.4s ease;
      pointer-events: none;
    }

    /* Overlay latar belakang gelap untuk mempertegas Bokeh */
    .lightbox-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 9000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .lightbox-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Format Buku Novel (ABSOLUTE STRICT CENTER) */
    .book-page {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      
      width: 420px;
      max-width: 85vw;
      
      height: 95dvh;
      max-height: 580px;
      
      background-color: #fbf7ef;
      border-radius: 4px 12px 12px 4px;
      padding: 18px 30px 12px 35px;
      box-shadow: 
        -10px 0 20px rgba(0,0,0,0.4),
        0 15px 35px rgba(0,0,0,0.6),
        inset 20px 0 30px -10px rgba(0,0,0,0.08),
        inset -2px 0 5px rgba(0,0,0,0.05);
      
      border-left: 12px solid #3d2716;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
      color: #2c221e;
      line-height: 1.4;
      box-sizing: border-box;
      flex-shrink: 0;
      transition: filter 0.4s ease;
    }

    /* Konten Teks Dalam Buku */
    .book-content {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      text-align: justify;
      hyphens: auto;
      transition: font-size 0.15s ease;
    }

    .book-content p {
      text-indent: 1.8em;
      margin-bottom: 0.1em;
    }

    .book-content p.continuation {
      text-indent: 0;
    }

    /* Footer & Pengaturan Kontrol */
    .book-footer {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 6px;
      border-top: 1px solid rgba(139, 90, 43, 0.2);
      user-select: none;
      margin-top: 4px;
      flex-shrink: 0;

      position: relative;
      z-index: 9999;
    }

    /* Kontrol Navigasi & Info Halaman */
    .nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-number {
      font-style: italic;
      color: #7a6352;
      font-size: 0.85rem;
    }

    .nav-btn {
      background: #5c3a21;
      color: #f3ece1;
      border: none;
      padding: 6px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .nav-btn:hover:not(:disabled) {
      background: #7a4f2d;
      transform: translateY(-1px);
    }

    .nav-btn:disabled {
      background: #cfc5b8;
      color: #9c9285;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Slider Pengaturan Ukuran Font (5 Tingkat) */
    .font-slider-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 0.75rem;
      color: #6b5344;
    }

    .font-slider-container input[type=range] {
      -webkit-appearance: none;
      width: 140px;
      height: 5px;
      background: #d4c5b2;
      border-radius: 3px;
      outline: none;
    }

    .font-slider-container input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #5c3a21;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .font-slider-container input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* Styling 7 Foto Polaroid */
    .polaroid {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 110px;
      background: #fff;
      padding: 7px 7px 15px 7px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.4);
      border-radius: 2px;
      z-index: 50;
      cursor: grab;
      user-select: none;
      touch-action: none;
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.3s ease, filter 0.4s ease;
    }

    .polaroid:active {
      cursor: grabbing;
    }

    /* Mode Zoomed Polaroid */
    .polaroid.zoomed {
      z-index: 10000 !important;
      cursor: pointer;
      box-shadow: 0 25px 50px rgba(0,0,0,0.8), 0 0 30px rgba(255,255,255,0.2) !important;
      transform: translate(-50%, -50%) scale(3.2) rotate(0deg) !important;
    }

    .polaroid img {
      width: 100%;
      height: 95px;
      object-fit: cover;
      display: block;
      filter: sepia(0.12) contrast(1.05);
      pointer-events: none;
    }

    .status-msg {
      text-align: center;
      font-style: italic;
      color: #6b5344;
      margin-top: 40%;
    }
  </style>
</head>
<body>

  <div class="desk-container" id="deskContainer">
    <!-- Overlay Gelap untuk Efek Zoom Bokeh -->
    <div class="lightbox-overlay" id="lightboxOverlay" onclick="closeZoomedPolaroid()"></div>

    <!-- 7 Foto Polaroid -->
    <div class="polaroid" id="polaroid1"><img src="" alt="Foto 1"></div>
    <div class="polaroid" id="polaroid2"><img src="" alt="Foto 2"></div>
    <div class="polaroid" id="polaroid3"><img src="" alt="Foto 3"></div>
    <div class="polaroid" id="polaroid4"><img src="" alt="Foto 4"></div>
    <div class="polaroid" id="polaroid5"><img src="" alt="Foto 5"></div>
    <div class="polaroid" id="polaroid6"><img src="" alt="Foto 6"></div>
    <div class="polaroid" id="polaroid7"><img src="" alt="Foto 7"></div>

    <!-- Halaman Utama Buku -->
    <div class="book-page">
      <div class="book-content" id="bookContent">
        <div class="status-msg">Memuat cerita benivon1.txt...</div>
      </div>
      
      <div class="book-footer">
        <!-- Slider Font: Default di set ke value 2 -->
        <div class="font-slider-container">
          <span>A-</span>
          <input type="range" id="fontSizeSlider" min="1" max="5" value="2" step="1" onchange="changeFontSize(this.value)">
          <span>A+</span>
        </div>

        <!-- Navigasi -->
        <div class="nav-row">
          <button class="nav-btn" id="prevBtn" onclick="changePage(-1)">← Back</button>
          <span class="page-number" id="pageIndicator">Hal. 0 / 0</span>
          <button class="nav-btn" id="nextBtn" onclick="changePage(1)">Next →</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const FILE_URL = 'benivon1.txt';
    let rawParagraphs = [];
    let pages = [];
    let currentPage = 0;

    // 5 Tingkat Ukuran Font
    const fontSizes = ['0.82rem', '0.92rem', '1.0rem', '1.1rem', '1.22rem'];
    let topZIndex = 100;
    let activeZoomedEl = null;

    // --- PROTEKSI PINCH-TO-ZOOM VIA JAVASCRIPT ---
    document.addEventListener('touchmove', function (event) {
      if (event.touches.length > 1) {
        event.preventDefault(); // Blokir zoom 2 jari
      }
    }, { passive: false });

    document.addEventListener('gesturestart', function (event) {
      event.preventDefault(); // Blokir gestur pinch iOS Safari
    });

    // 1. Memuat File TXT
    async function loadNovel() {
      try {
        const response = await fetch(FILE_URL);
        if (!response.ok) throw new Error('File benivon1.txt tidak ditemukan');
        
        const text = await response.text();
        rawParagraphs = text.split(/\r?\n/).filter(p => p.trim() !== '');
        
        recalculatePagination();
      } catch (err) {
        document.getElementById('bookContent').innerHTML = 
          `<div class="status-msg" style="color: #a33;">Gagal memuat file novel.<br><sup>${err.message}</sup></div>`;
      }
    }

    // 2. Kalkulasi Pagination
    function recalculatePagination() {
      if (rawParagraphs.length === 0) return;

      const contentContainer = document.getElementById('bookContent');
      const sliderVal = document.getElementById('fontSizeSlider').value;
      const activeFontSize = fontSizes[sliderVal - 1]; 
      contentContainer.style.fontSize = activeFontSize;

      contentContainer.innerHTML = '';
      pages = [];

      // Pengukur Dummy Element
      const tempDiv = document.createElement('div');
      tempDiv.className = 'book-content';
      tempDiv.style.visibility = 'hidden';
      tempDiv.style.position = 'absolute';
      tempDiv.style.width = contentContainer.clientWidth + 'px';
      tempDiv.style.fontSize = activeFontSize;
      tempDiv.style.lineHeight = getComputedStyle(contentContainer).lineHeight;
      tempDiv.style.fontFamily = getComputedStyle(contentContainer).fontFamily;
      document.body.appendChild(tempDiv);

      const maxHeight = contentContainer.clientHeight;
      let currentPageNodes = [];

      function getPageHTML(nodes) {
        return nodes.map(n => n.outerHTML).join('');
      }

      for (let pIndex = 0; pIndex < rawParagraphs.length; pIndex++) {
        const fullText = rawParagraphs[pIndex];
        const words = fullText.split(' ');
        
        let pElem = document.createElement('p');
        let isContinuation = false;
        let wordIndex = 0;

        while (wordIndex < words.length) {
          const wordToAdd = words[wordIndex];
          const currentText = pElem.innerText;
          pElem.innerText = currentText ? currentText + ' ' + wordToAdd : wordToAdd;

          if (isContinuation) {
            pElem.classList.add('continuation');
          }

          tempDiv.innerHTML = getPageHTML(currentPageNodes) + pElem.outerHTML;

          if (tempDiv.clientHeight > maxHeight) {
            const textArr = pElem.innerText.split(' ');
            textArr.pop();
            
            if (textArr.length > 0) {
              pElem.innerText = textArr.join(' ');
              currentPageNodes.push(pElem);
            }

            if (currentPageNodes.length > 0) {
              pages.push(getPageHTML(currentPageNodes));
              currentPageNodes = [];
            }

            pElem = document.createElement('p');
            pElem.classList.add('continuation');
            isContinuation = true;
          } else {
            wordIndex++;
          }
        }

        if (pElem.innerText.trim() !== '') {
          currentPageNodes.push(pElem);
        }
      }

      if (currentPageNodes.length > 0) {
        pages.push(getPageHTML(currentPageNodes));
      }

      document.body.removeChild(tempDiv);

      if (currentPage >= pages.length) {
        currentPage = Math.max(0, pages.length - 1);
      }

      renderPage();
    }        

    // 3. Render Halaman
    function renderPage() {
      const contentDiv = document.getElementById('bookContent');
      const pageIndicator = document.getElementById('pageIndicator');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');

      if (pages.length === 0) return;

      contentDiv.innerHTML = pages[currentPage];
      pageIndicator.innerText = `Hal. ${currentPage + 1} / ${pages.length}`;

      prevBtn.disabled = currentPage === 0;
      nextBtn.disabled = currentPage === pages.length - 1;
    }

    // 4. Navigasi Halaman
    function changePage(direction) {
      if (currentPage + direction >= 0 && currentPage + direction < pages.length) {
        currentPage += direction;
        renderPage();
      }
    }

    // 5. Perubahan Slider Font Size
    function changeFontSize(val) {
      recalculatePagination();
    }

    // 6. Penataan Foto Polaroid (Fix Akurat untuk GitHub Pages User/Project Site & Localhost)
    async function randomizePolaroids() {
      const polaroidConfigs = [
        { id: 'polaroid1', baseArea: { x: [-300, -230], y: [-150, -60] } },
        { id: 'polaroid2', baseArea: { x: [-310, -240], y: [-20, 50] } },
        { id: 'polaroid3', baseArea: { x: [-290, -220], y: [90, 150] } },
        { id: 'polaroid4', baseArea: { x: [-60, 60], y: [-160, -120] } },
        { id: 'polaroid5', baseArea: { x: [230, 300], y: [-150, -60] } },
        { id: 'polaroid6', baseArea: { x: [240, 310], y: [-20, 50] } },
        { id: 'polaroid7', baseArea: { x: [220, 290], y: [90, 150] } }
      ];

      let foundImages = [];

      // A. JIKA DIBUKA DI GITHUB PAGES (Dinamis mendeteksi User Site maupun Project Site)
      if (window.location.hostname.includes('github.io')) {
        const username = window.location.hostname.split('.')[0];
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        
        // Jika URL berupa username.github.io/namarepo -> repo = namarepo
        // Jika URL berupa username.github.io -> repo = username.github.io
        const repo = pathSegments.length > 0 ? pathSegments[0] : `${username}.github.io`;
        const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/images`;

        try {
          const res = await fetch(apiUrl);
          if (res.ok) {
            const files = await res.json();
            foundImages = files
              .map(file => file.name)
              .filter(name => name.match(/\.(jpe?g)$/i));
          } else {
            console.warn('GitHub API Response status:', res.status);
          }
        } catch (e) {
          console.error('Gagal mengambil daftar gambar dari GitHub API:', e);
        }
      }

      // B. JIKA DIBUKA DI LOCALHOST (Directory Listing)
      if (foundImages.length === 0) {
        try {
          const res = await fetch('images/');
          if (res.ok) {
            const htmlText = await res.text();
            const doc = new DOMParser().parseFromString(htmlText, 'text/html');
            const links = Array.from(doc.querySelectorAll('a'));
            
            foundImages = links
              .map(a => a.getAttribute('href'))
              .filter(href => href && href.match(/\.(jpe?g)$/i))
              .map(href => href.split('/').pop());
          }
        } catch (e) {
          console.log('Local directory listing tidak tersedia.');
        }
      }

      // C. JIKA SEMUA CARA OTOMATIS DI ATAS GAGAL (Atau jika API terkena Rate Limit)
      if (foundImages.length === 0) {
        console.warn('Menggunakan fallback image finder...');
        // Opsi darurat untuk memastikan foto tetap dicoba muat
        for (let i = 1; i <= 20; i++) {
          foundImages.push(`${i}.jpeg`);
          foundImages.push(`foto${i}.jpeg`);
          foundImages.push(`image${i}.jpeg`);
        }
      }

      // Acak urutan gambar
      let shuffled = [...foundImages].sort(() => 0.5 - Math.random());

      polaroidConfigs.forEach((config, index) => {
        const el = document.getElementById(config.id);
        if (!el) return;

        const imgEl = el.querySelector('img');
        const selectedImg = shuffled[index % shuffled.length];
        
        imgEl.src = `images/${selectedImg}`;

        // Jika foto gagal muat (misal karena nama tebakan fallback tidak ada), sembunyikan atau biarkan onerror menangani
        imgEl.onerror = function() {
          // Mencegah gambar pecah/error berulang
          this.onerror = null;
        };

        const randomX = Math.floor(Math.random() * (config.baseArea.x[1] - config.baseArea.x[0])) + config.baseArea.x[0];
        const randomY = Math.floor(Math.random() * (config.baseArea.y[1] - config.baseArea.y[0])) + config.baseArea.y[0];
        const randomRotate = Math.floor(Math.random() * 50) - 25;

        el.dataset.x = randomX;
        el.dataset.y = randomY;
        el.dataset.rotate = randomRotate;

        el.style.transform = `translate(${randomX}px, ${randomY}px) rotate(${randomRotate}deg)`;

        makeElementDraggableAndZoomable(el);
      });
    }


    // 7. Drag & Drop + Click to Zoom Listener
    function makeElementDraggableAndZoomable(el) {
      let isDragging = false;
      let startX, startY;
      let initialX = parseFloat(el.dataset.x) || 0;
      let initialY = parseFloat(el.dataset.y) || 0;
      let rotate = parseFloat(el.dataset.rotate) || 0;
      
      let moveDistance = 0; // Untuk membedakan Klik biasa vs Dragging

      function onStart(e) {
        if (el.classList.contains('zoomed')) return; // Abaikan jika sedang mode zoom

        isDragging = true;
        moveDistance = 0;
        topZIndex++;
        el.style.zIndex = topZIndex;

        const clientX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
        const clientY = e.type.startsWith('touch') ? e.touches[0].clientY : e.clientY;

        startX = clientX - initialX;
        startY = clientY - initialY;

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('touchend', onEnd);
      }

      function onMove(e) {
        if (!isDragging) return;
        if (e.cancelable) e.preventDefault();

        const clientX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
        const clientY = e.type.startsWith('touch') ? e.touches[0].clientY : e.clientY;

        const deltaX = clientX - startX - initialX;
        const deltaY = clientY - startY - initialY;
        moveDistance += Math.abs(deltaX) + Math.abs(deltaY);

        initialX = clientX - startX;
        initialY = clientY - startY;

        el.dataset.x = initialX;
        el.dataset.y = initialY;

        el.style.transform = `translate(${initialX}px, ${initialY}px) rotate(${rotate}deg)`;
      }

      function onEnd() {
        isDragging = false;
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onEnd);
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('touchend', onEnd);

        // Jika tidak diseret (moveDistance kecil), anggap sebagai KLIK / TAP
        if (moveDistance < 5) {
          toggleZoomPolaroid(el);
        }
      }

      el.addEventListener('mousedown', onStart);
      el.addEventListener('touchstart', onStart, { passive: false });
    }

    // 8. Logika Zoom / Unzoom Polaroid & Blur Background
    function toggleZoomPolaroid(el) {
      if (el.classList.contains('zoomed')) {
        closeZoomedPolaroid();
      } else {
        if (activeZoomedEl) closeZoomedPolaroid();

        activeZoomedEl = el;
        el.classList.add('zoomed');

        document.getElementById('deskContainer').classList.add('blurred');
        document.getElementById('lightboxOverlay').classList.add('active');
      }
    }

    function closeZoomedPolaroid() {
      if (!activeZoomedEl) return;

      const el = activeZoomedEl;
      const initialX = parseFloat(el.dataset.x) || 0;
      const initialY = parseFloat(el.dataset.y) || 0;
      const rotate = parseFloat(el.dataset.rotate) || 0;

      el.classList.remove('zoomed');
      el.style.transform = `translate(${initialX}px, ${initialY}px) rotate(${rotate}deg)`;

      document.getElementById('deskContainer').classList.remove('blurred');
      document.getElementById('lightboxOverlay').classList.remove('active');

      activeZoomedEl = null;
    }

    window.addEventListener('DOMContentLoaded', () => {
      randomizePolaroids();
      loadNovel();
    });

    window.addEventListener('resize', () => {
      if (rawParagraphs.length > 0) {
        recalculatePagination();
      }
    });
  </script>
</body>
</html>
